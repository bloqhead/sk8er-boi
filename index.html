<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SK8ER BOI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,1,0&display=block" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    #game-container {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    #game-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ── Arcade panel ──────────────────────────────────────────────── */
    #arcade-panel {
      flex: 0 0 auto;
      display: none;
      background: linear-gradient(180deg, #1a1014 0%, #0d080a 60%, #080508 100%);
      border-top: 3px solid #3a1a22;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.8), 0 -2px 6px rgba(255,45,120,0.15);
      padding: 6px 0 max(10px, env(safe-area-inset-bottom));
      position: relative;
    }

    /* Neon edge stripe */
    #arcade-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #ff2d78 20%, #f5e642 50%, #ff2d78 80%, transparent);
      opacity: 0.6;
    }

    /* Top row: pause only */
    .panel-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 18px 4px;
    }

    /* Main button row */
    .panel-buttons {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 12px;
    }

    .arc-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Base face style */
    .arc-btn-face {
      width: 58px; height: 58px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Material Symbols Rounded', sans-serif;
      font-size: 28px;
      color: #fff;
      border: 3px solid rgba(255,255,255,0.15);
      box-shadow:
        0 5px 0 rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 0 10px rgba(0,0,0,0.5);
      transition: transform 60ms, box-shadow 60ms;
      cursor: pointer;
    }

    .arc-btn-face:active,
    .arc-btn-face.pressed {
      transform: translateY(4px);
      box-shadow:
        0 1px 0 rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .arc-btn-face.btn-slow  { background: radial-gradient(circle at 35% 35%, #2a55ee, #0a1888); }
    .arc-btn-face.btn-fast  { background: radial-gradient(circle at 35% 35%, #2a55ee, #0a1888); }
    .arc-btn-face.btn-ollie {
      background: radial-gradient(circle at 35% 35%, #ee2060, #880020);
      width: 72px; height: 72px; font-size: 32px;
    }

    /* Pause — small, sits in top-right row */
    .arc-btn-face.btn-pause {
      width: 32px; height: 32px;
      font-size: 16px;
      background: radial-gradient(circle at 35% 35%, #444466, #1a1a33);
      border-width: 2px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.6);
    }

    .arc-btn-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: #888;
      letter-spacing: 0.5px;
    }

    .panel-screws {
      display: flex;
      justify-content: space-between;
      padding: 3px 10px 0;
    }
    .screw {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #555, #222);
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <div id="arcade-panel">
      <div class="panel-screws">
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
        <div class="screw"></div>
      </div>

      <!-- Pause sits in its own small row above main buttons -->
      <div class="panel-top">
        <div class="arc-btn" id="btn-pause">
          <div class="arc-btn-face btn-pause">pause</div>
          <span class="arc-btn-label">PAUSE</span>
        </div>
      </div>

      <!-- Main controls — 3 centred buttons -->
      <div class="panel-buttons">
        <div class="arc-btn" id="btn-slow">
          <div class="arc-btn-face btn-slow">fast_rewind</div>
          <span class="arc-btn-label">SLOW</span>
        </div>
        <div class="arc-btn" id="btn-ollie">
          <div class="arc-btn-face btn-ollie">keyboard_arrow_up</div>
          <span class="arc-btn-label">OLLIE</span>
        </div>
        <div class="arc-btn" id="btn-fast">
          <div class="arc-btn-face btn-fast">fast_forward</div>
          <span class="arc-btn-label">FAST</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0
    if (isTouch) document.getElementById('arcade-panel').style.display = 'block'

    window._sk8_slow  = false
    window._sk8_ollie = false
    window._sk8_fast  = false

    function wireHoldBtn(id, flagKey) {
      const face = document.querySelector('#' + id + ' .arc-btn-face')
      if (!face) return
      const down = () => { window[flagKey] = true;  face.classList.add('pressed') }
      const up   = () => { window[flagKey] = false; face.classList.remove('pressed') }
      face.addEventListener('touchstart',  down, { passive: true })
      face.addEventListener('touchend',    up,   { passive: true })
      face.addEventListener('touchcancel', up,   { passive: true })
      face.addEventListener('mousedown',   down)
      face.addEventListener('mouseup',     up)
      face.addEventListener('mouseleave',  up)
    }

    wireHoldBtn('btn-slow',  '_sk8_slow')
    wireHoldBtn('btn-ollie', '_sk8_ollie')
    wireHoldBtn('btn-fast',  '_sk8_fast')

    // Pause: fires once on press (not held)
    const pauseFace = document.querySelector('#btn-pause .arc-btn-face')
    if (pauseFace) {
      const doPause = () => {
        pauseFace.classList.add('pressed')
        setTimeout(() => pauseFace.classList.remove('pressed'), 150)
        window.dispatchEvent(new CustomEvent('sk8_pause'))
      }
      pauseFace.addEventListener('touchstart', doPause, { passive: true })
      pauseFace.addEventListener('mousedown',  doPause)
    }
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
